name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify crypto runtime and tuning templates
        shell: pwsh
        run: |
          python -c "from Crypto.Cipher import AES; print('PyCryptodome AES import OK')"
          if (-not (Test-Path "tuning_templates/def/vehicle/truck/mercedes.actros2014/engine")) { throw "Mercedes engine templates are missing." }
          if (-not (Test-Path "tuning_templates/def/vehicle/truck/volvo.fh_2024/engine")) { throw "Volvo engine templates are missing." }
          if (-not (Test-Path "tuning_templates/def/vehicle/truck/scania.s_2024e/engine")) { throw "Scania engine templates are missing." }
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name ETS2SaveEditor --icon app.ico --version-file version_info.txt --collect-all Crypto --collect-all webview --hidden-import webview.platforms.edgechromium --hidden-import clr --add-data "ui;ui" --add-data "tuning_templates;tuning_templates" ets2_save_editor.py
      - name: Verify PyInstaller analysis collected runtime files
        shell: pwsh
        run: |
          $analysis = Get-Content "build/ETS2SaveEditor/Analysis-00.toc" -Raw
          if (-not $analysis.Contains("Crypto.Cipher.AES")) { throw "PyInstaller analysis does not contain Crypto.Cipher.AES." }
          if (-not $analysis.Contains("webview.platforms.edgechromium")) { throw "PyInstaller analysis does not contain the WebView2 backend." }
          if ($analysis -notmatch "ui[\\/]index\.html" -or $analysis -notmatch "ui[\\/]app\.js") { throw "PyInstaller analysis does not contain the complete UI." }
          if (-not $analysis.Contains("tuning_templates")) { throw "PyInstaller analysis does not contain the tuning templates." }
          if (-not (Test-Path "dist/ETS2SaveEditor.exe")) { throw "Standalone executable was not created." }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compile installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - name: Verify build outputs
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ETS2SaveEditor.exe")) { throw "Standalone executable was not created." }
          if (-not (Test-Path "installer/ETS2SaveEditor_Setup.exe")) { throw "Installer was not created." }
      - uses: actions/upload-artifact@v4
        with:
          name: ETS2SaveEditor-Windows
          path: |
            installer/ETS2SaveEditor_Setup.exe
            dist/ETS2SaveEditor.exe
          if-no-files-found: error
